name: Temporary NestJS Upgrade

on:
  push:
    branches:
      - chore/upgrade-nestjs

permissions:
  contents: write

jobs:
  upgrade-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/upgrade-nestjs
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Install current lockfile
        run: pnpm install --frozen-lockfile

      - name: Upgrade NestJS stack
        run: |
          pnpm --filter @tools4tech/api update --latest \
            @nestjs/common \
            @nestjs/core \
            @nestjs/platform-express \
            @nestjs/testing \
            @nestjs/cli \
            @nestjs/schematics \
            @nestjs/jwt \
            @nestjs/passport \
            @nestjs/swagger \
            @nestjs/throttler

      - name: Add explicit Express dependency
        run: |
          pnpm --filter @tools4tech/api add express@latest
          pnpm --filter @tools4tech/api add -D @types/express@latest

      - name: Align NestJS 12 TypeScript and Jest tooling
        run: |
          pnpm --filter @tools4tech/api add -D typescript@^6
          pnpm --filter @tools4tech/api update --latest jest @types/jest ts-jest @types/node

      - name: Install Rspack builder dependencies
        run: |
          pnpm --filter @tools4tech/api add -D @rspack/core@latest webpack-node-externals@latest tsconfig-paths-webpack-plugin@latest

      - name: Commit dependency updates
        shell: bash
        run: |
          if ! git diff --quiet -- apps/api/package.json pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/api/package.json pnpm-lock.yaml
            git commit -m "chore(api): upgrade NestJS stack"
            git push origin HEAD:chore/upgrade-nestjs
          fi

      - name: Build API
        run: pnpm --filter @tools4tech/api build

      - name: Run API unit tests
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: pnpm --filter @tools4tech/api test --runInBand
