name: Temporary Prisma 7 Database Smoke

on:
  push:
    branches:
      - chore/upgrade-prisma7

permissions:
  contents: read

jobs:
  db-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devlist
          POSTGRES_PASSWORD: devlist
          POSTGRES_DB: devlist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devlist -d devlist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://devlist:devlist@localhost:5432/devlist?schema=public
      DIRECT_URL: postgresql://devlist:devlist@localhost:5432/devlist?schema=public
      JWT_SECRET: test-jwt-secret
      GITHUB_ID: test-github-id
      GITHUB_SECRET: test-github-secret
      API_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: production
      PORT: 3001

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/upgrade-prisma7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @tools4tech/api exec prisma migrate deploy

      - name: Build API
        run: pnpm --filter @tools4tech/api build

      - name: Smoke start API against PostgreSQL
        shell: bash
        run: |
          set +e
          timeout 6s pnpm --filter @tools4tech/api start:prod
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "API exited unexpectedly with status $status"
            exit "$status"
          fi
          echo "API remained running and connected to PostgreSQL."
