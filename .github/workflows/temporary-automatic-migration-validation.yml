name: Temporary Automatic Migration Validation

on:
  push:
    branches:
      - feat/automatic-prisma-migrations

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: devlist
      POSTGRES_PASSWORD: devlist
      POSTGRES_DB: devlist
      DATABASE_URL: postgresql://devlist:devlist@postgres:5432/devlist?schema=public
      DIRECT_URL: postgresql://devlist:devlist@postgres:5432/devlist?schema=public
      JWT_SECRET: test-jwt-secret
      GITHUB_ID: test-github-id
      GITHUB_SECRET: test-github-secret
      GITHUB_TOKEN: test-github-token
      API_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_URL_API: http://localhost:3001
      URL_API: http://api:3001

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/automatic-prisma-migrations

      - name: Validate Compose config
        run: docker compose config --quiet

      - name: Build API and migrator without cache
        run: docker compose build --no-cache migrate api

      - name: Start API through dependency chain
        run: docker compose up -d api

      - name: Verify migration service completed successfully
        shell: bash
        run: |
          exit_code="$(docker inspect -f '{{.State.ExitCode}}' devlist-migrate)"
          if [ "$exit_code" != "0" ]; then
            docker compose logs migrate
            echo "Expected migrate exit code 0, got $exit_code"
            exit 1
          fi

      - name: Verify reconciled schema exists
        shell: bash
        run: |
          refresh_table="$(
            docker compose exec -T postgres               psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc               "SELECT to_regclass('public.refresh_tokens');"
          )"

          if [ "$refresh_table" != "refresh_tokens" ]; then
            echo "refresh_tokens table was not created"
            exit 1
          fi

          migration_count="$(
            docker compose exec -T postgres               psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc               'SELECT COUNT(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL;'
          )"

          if [ "$migration_count" -lt 13 ]; then
            echo "Expected all migrations to be applied, got $migration_count"
            exit 1
          fi

      - name: Wait for API
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3001/api >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api migrate
          exit 1

      - name: Re-run migrator against the same database
        shell: bash
        run: |
          docker compose rm -sf api migrate
          docker compose up -d api

          exit_code="$(docker inspect -f '{{.State.ExitCode}}' devlist-migrate)"
          if [ "$exit_code" != "0" ]; then
            docker compose logs migrate
            exit 1
          fi

          docker compose logs migrate | grep -E "No pending migrations|already in sync|Database schema is up to date" >/dev/null || {
            echo "Migrator did not report an idempotent/no-op deployment"
            docker compose logs migrate
            exit 1
          }

      - name: Verify API after repeated migration
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3001/api >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api migrate
          exit 1

      - name: Cleanup success scenario
        run: docker compose down -v

      - name: Create failing migration override
        run: |
          cat > docker-compose.fail.yml <<'YAML'
          services:
            migrate:
              command: ["sh", "-c", "echo intentional migration failure >&2; exit 42"]
          YAML

      - name: Verify failed migration blocks API startup
        shell: bash
        run: |
          set +e
          docker compose -f docker-compose.yml -f docker-compose.fail.yml up -d api
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Compose unexpectedly succeeded despite migration failure"
            docker compose -f docker-compose.yml -f docker-compose.fail.yml logs
            exit 1
          fi

          if docker compose -f docker-compose.yml -f docker-compose.fail.yml ps --status running --services | grep -qx api; then
            echo "API is running even though migration failed"
            docker compose -f docker-compose.yml -f docker-compose.fail.yml logs
            exit 1
          fi

          migrate_exit="$(docker inspect -f '{{.State.ExitCode}}' devlist-migrate)"
          if [ "$migrate_exit" != "42" ]; then
            echo "Expected intentional migrate exit 42, got $migrate_exit"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.fail.yml down -v || docker compose down -v
