name: Temporary Prisma Drift Validation

on:
  push:
    branches:
      - fix/prisma-migration-drift

permissions:
  contents: read

jobs:
  validate-drift-fix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devlist
          POSTGRES_PASSWORD: devlist
          POSTGRES_DB: devlist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devlist -d devlist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://devlist:devlist@localhost:5432/devlist?schema=public
      DIRECT_URL: postgresql://devlist:devlist@localhost:5432/devlist?schema=public

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/prisma-migration-drift

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply historical migrations without reconciliation
        shell: bash
        run: |
          mv apps/api/prisma/migrations/20261005164500_reconcile_schema_drift /tmp/reconcile_schema_drift
          pnpm --filter @tools4tech/api exec prisma migrate deploy

      - name: Simulate legacy data and partial manual auth table
        working-directory: apps/api
        shell: bash
        run: |
          cat <<'SQL' | pnpm exec prisma db execute --stdin
          INSERT INTO "users" ("githubId", "name", "email", "avatar", "role")
          VALUES (1, 'Legacy User', 'legacy@example.com', 'avatar', 'USER');

          INSERT INTO "categories" ("id", "name")
          VALUES ('category-1', 'Legacy Category');

          INSERT INTO "tools" ("id", "name", "link", "description", "categoryId")
          VALUES ('tool-1', 'Legacy Tool', 'https://example.com/tool-1', 'Legacy tool', 'category-1');

          INSERT INTO "favorites" ("id", "userId", "toolId")
          VALUES
            ('favorite-1', 1, 'tool-1'),
            ('favorite-2', 1, 'tool-1');

          CREATE TABLE "refresh_tokens" (
              "id" TEXT NOT NULL,
              "tokenHash" TEXT NOT NULL,
              "userId" INTEGER NOT NULL,
              "expiresAt" TIMESTAMP(3) NOT NULL,
              "usedAt" TIMESTAMP(3),
              "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              CONSTRAINT "refresh_tokens_pkey" PRIMARY KEY ("id")
          );

          INSERT INTO "refresh_tokens"
            ("id", "tokenHash", "userId", "expiresAt")
          VALUES
            ('refresh-1', 'legacy-token-hash', 1, NOW() + INTERVAL '1 day');
          SQL

      - name: Restore and deploy reconciliation migration
        shell: bash
        run: |
          mv /tmp/reconcile_schema_drift apps/api/prisma/migrations/20261005164500_reconcile_schema_drift
          pnpm --filter @tools4tech/api exec prisma migrate deploy

      - name: Verify legacy duplicate cleanup and constraints
        working-directory: apps/api
        shell: bash
        run: |
          node <<'NODE'
          const { Client } = require('pg');

          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();

            const duplicateCount = await client.query(
              'SELECT COUNT(*)::int AS count FROM "favorites" WHERE "userId" = 1 AND "toolId" = $1',
              ['tool-1'],
            );

            if (duplicateCount.rows[0].count !== 1) {
              throw new Error(`Expected 1 favorite after reconciliation, got ${duplicateCount.rows[0].count}`);
            }

            const refreshUnique = await client.query(
              "SELECT 1 FROM pg_indexes WHERE schemaname = 'public' AND indexname = 'refresh_tokens_tokenHash_key'",
            );

            const favoritesUnique = await client.query(
              "SELECT 1 FROM pg_indexes WHERE schemaname = 'public' AND indexname = 'favorites_userId_toolId_key'",
            );

            const constraints = await client.query(
              "SELECT conname FROM pg_constraint WHERE conname IN ('refresh_tokens_userId_fkey', 'tools_categoryId_fkey')",
            );

            const names = new Set(constraints.rows.map((row) => row.conname));

            if (refreshUnique.rowCount !== 1) throw new Error('Missing refresh token unique index');
            if (favoritesUnique.rowCount !== 1) throw new Error('Missing favorites unique index');
            if (!names.has('refresh_tokens_userId_fkey')) throw new Error('Missing refresh token FK');
            if (!names.has('tools_categoryId_fkey')) throw new Error('Missing canonical tools category FK');

            await client.end();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Assert database and Prisma schema are in sync
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate diff \
            --exit-code \
            --from-config-datasource \
            --to-schema prisma/schema.prisma

      - name: Verify deploy is repeatable
        run: pnpm --filter @tools4tech/api exec prisma migrate deploy

      - name: Validate schema and run API tests
        run: |
          pnpm --filter @tools4tech/api exec prisma validate
          pnpm --filter @tools4tech/api build
          pnpm --filter @tools4tech/api test --runInBand
