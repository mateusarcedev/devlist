name: Temporary Web Dependency Upgrade

on:
  push:
    branches:
      - chore/upgrade-web-dependencies

permissions:
  contents: write

jobs:
  upgrade-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/upgrade-web-dependencies
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Install current lockfile
        run: pnpm install --frozen-lockfile

      - name: Upgrade web dependencies
        run: |
          pnpm --filter @tools4tech/web update --latest \
            @tailwindcss/postcss \
            @tanstack/react-query \
            @vercel/analytics \
            @vercel/speed-insights \
            autoprefixer \
            axios \
            clsx \
            debug \
            dotenv \
            framer-motion \
            jose \
            lucide-react \
            postcss \
            react-hook-form \
            react-icons \
            supports-color \
            swr \
            tailwind-merge \
            tailwindcss \
            zod \
            typescript@^6

      - name: Commit dependency updates
        shell: bash
        run: |
          if ! git diff --quiet -- apps/web/package.json pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/package.json pnpm-lock.yaml
            git commit -m "chore(web): update frontend dependencies"
            git push origin HEAD:chore/upgrade-web-dependencies
          fi

      - name: Lint web
        run: pnpm --filter @tools4tech/web lint

      - name: Build web
        run: pnpm --filter @tools4tech/web build
