name: Temporary Web Dependency Validation

on:
  push:
    branches:
      - chore/upgrade-web-dependencies

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/upgrade-web-dependencies

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter @tools4tech/web lint

      - name: Build web
        run: pnpm --filter @tools4tech/web build
