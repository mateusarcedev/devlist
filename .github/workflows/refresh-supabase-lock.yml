name: Refresh migration lockfile

on:
  push:
    branches:
      - feat/supabase-vercel-migration

permissions:
  contents: write

concurrency:
  group: refresh-supabase-lock
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Resolve lockfile without running package scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit only lockfile change
        run: |
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(lock): regenerate Supabase dependency lockfile'
            git push
          fi
