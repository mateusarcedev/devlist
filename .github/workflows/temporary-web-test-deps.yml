name: Temporary Web Test Dependency Bootstrap

on:
  push:
    branches:
      - test/web-foundation

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: test/web-foundation

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Install test dependencies
        run: |
          pnpm --filter @tools4tech/web add -D             vitest             jsdom             @testing-library/react             @testing-library/jest-dom             @testing-library/user-event

      - name: Commit dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "test(web): add frontend testing dependencies"
          git push origin HEAD:test/web-foundation
