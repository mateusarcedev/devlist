name: Temporary Demo Seed Validation

on:
  push:
    branches:
      - feat/demo-seed

permissions:
  contents: write

jobs:
  validate-seed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devlist
          POSTGRES_PASSWORD: devlist
          POSTGRES_DB: devlist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devlist -d devlist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://devlist:devlist@localhost:5432/devlist?schema=public
      DIRECT_URL: postgresql://devlist:devlist@localhost:5432/devlist?schema=public

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/demo-seed

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(api): update lockfile for seed tooling"
            git push origin HEAD:feat/demo-seed
          fi

      - name: Apply migrations
        run: pnpm --filter @tools4tech/api exec prisma migrate deploy

      - name: Generate client
        run: pnpm --filter @tools4tech/api exec prisma generate

      - name: Run demo seed
        run: pnpm --filter @tools4tech/api seed:demo

      - name: Verify initial seed counts
        shell: bash
        run: |
          node <<'NODE'
          const { Client } = require('pg');

          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();

            const categories = await client.query('SELECT COUNT(*)::int AS count FROM "categories"');
            const tools = await client.query('SELECT COUNT(*)::int AS count FROM "tools"');
            const users = await client.query('SELECT COUNT(*)::int AS count FROM "users"');

            if (categories.rows[0].count !== 8) {
              throw new Error(`Expected 8 categories, got ${categories.rows[0].count}`);
            }
            if (tools.rows[0].count !== 24) {
              throw new Error(`Expected 24 tools, got ${tools.rows[0].count}`);
            }
            if (users.rows[0].count !== 0) {
              throw new Error(`Seed must not create users; got ${users.rows[0].count}`);
            }

            await client.end();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Simulate user edits and custom data
        shell: bash
        run: |
          node <<'NODE'
          const { Client } = require('pg');

          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();

            await client.query(
              'UPDATE "tools" SET "description" = $1 WHERE "link" = $2',
              ['Custom description preserved by seed', 'https://nextjs.org/'],
            );

            const category = await client.query(
              'INSERT INTO "categories" ("id", "name") VALUES ($1, $2) RETURNING "id"',
              ['99999999-9999-4999-8999-999999999999', 'Custom'],
            );

            await client.query(
              'INSERT INTO "tools" ("id", "name", "link", "description", "categoryId") VALUES ($1, $2, $3, $4, $5)',
              [
                '88888888-8888-4888-8888-888888888888',
                'Custom Tool',
                'https://example.com/custom-tool',
                'User-created tool',
                category.rows[0].id,
              ],
            );

            await client.end();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Run demo seed again
        run: pnpm --filter @tools4tech/api seed:demo

      - name: Verify seed is idempotent and non-destructive
        shell: bash
        run: |
          node <<'NODE'
          const { Client } = require('pg');

          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();

            const categories = await client.query('SELECT COUNT(*)::int AS count FROM "categories"');
            const tools = await client.query('SELECT COUNT(*)::int AS count FROM "tools"');
            const next = await client.query(
              'SELECT "description" FROM "tools" WHERE "link" = $1',
              ['https://nextjs.org/'],
            );

            if (categories.rows[0].count !== 9) {
              throw new Error(`Expected custom category to remain, got ${categories.rows[0].count} categories`);
            }
            if (tools.rows[0].count !== 25) {
              throw new Error(`Expected custom tool to remain without seed duplicates, got ${tools.rows[0].count} tools`);
            }
            if (next.rows[0]?.description !== 'Custom description preserved by seed') {
              throw new Error('Seed overwrote an existing tool');
            }

            await client.end();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Validate API
        run: |
          pnpm --filter @tools4tech/api lint
          pnpm --filter @tools4tech/api build
          pnpm --filter @tools4tech/api test --runInBand

  validate-docker-seed:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: devlist
      POSTGRES_PASSWORD: devlist
      POSTGRES_DB: devlist
      DATABASE_URL: postgresql://devlist:devlist@postgres:5432/devlist?schema=public
      DIRECT_URL: postgresql://devlist:devlist@postgres:5432/devlist?schema=public
      JWT_SECRET: test-jwt-secret
      GITHUB_ID: test-github-id
      GITHUB_SECRET: test-github-secret
      GITHUB_TOKEN: test-github-token
      API_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_URL_API: http://localhost:3001
      URL_API: http://api:3001

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/demo-seed

      - name: Validate Compose config
        run: docker compose --profile demo config --quiet

      - name: Build seed image without cache
        run: docker compose --profile demo build --no-cache seed

      - name: Run Docker seed
        run: docker compose --profile demo run --rm seed

      - name: Verify Docker-seeded database
        shell: bash
        run: |
          categories="$(
            docker compose exec -T postgres               psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc               'SELECT COUNT(*) FROM "categories";'
          )"
          tools="$(
            docker compose exec -T postgres               psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc               'SELECT COUNT(*) FROM "tools";'
          )"

          test "$categories" = "8"
          test "$tools" = "24"

      - name: Run Docker seed again
        run: docker compose --profile demo run --rm seed

      - name: Verify Docker seed remains idempotent
        shell: bash
        run: |
          tools="$(
            docker compose exec -T postgres               psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc               'SELECT COUNT(*) FROM "tools";'
          )"
          test "$tools" = "24"

      - name: Cleanup
        if: always()
        run: docker compose --profile demo down -v
