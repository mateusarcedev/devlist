name: Temporary Admin API Authorization Validation

on:
  push:
    branches:
      - fix/admin-api-authorization
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devlist
          POSTGRES_PASSWORD: devlist
          POSTGRES_DB: devlist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devlist -d devlist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://devlist:devlist@localhost:5432/devlist?schema=public
      DIRECT_URL: postgresql://devlist:devlist@localhost:5432/devlist?schema=public
      JWT_SECRET: e2e-jwt-secret
      GITHUB_ID: e2e-github-id
      GITHUB_SECRET: e2e-github-secret
      API_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Publish pending validation status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"pending\",\"context\":\"temporary/admin-auth-validation\",\"description\":\"Admin auth validation running\",\"target_url\":\"$RUN_URL\"}"

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-api-authorization

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @tools4tech/api exec prisma migrate deploy

      - name: Lint API
        run: pnpm --filter @tools4tech/api lint

      - name: Build API
        run: pnpm --filter @tools4tech/api build

      - name: Run unit tests
        run: pnpm --filter @tools4tech/api test --runInBand

      - name: Run E2E tests
        run: pnpm --filter @tools4tech/api test:e2e

      - name: Publish validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success
          else
            STATE=failure
          fi

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{"state":"$STATE","context":"temporary/admin-auth-validation","description":"Admin auth validation: $JOB_STATUS","target_url":"$RUN_URL"}"
