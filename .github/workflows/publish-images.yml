name: Publish production images

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-production-images
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/devlist-api:${{ env.SOURCE_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/devlist-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push migrator
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/devlist-migrate:${{ env.SOURCE_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/devlist-migrate:latest
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: true
          build-args: |
            NEXT_PUBLIC_URL_API=${{ vars.PRODUCTION_API_URL || 'https://api.devlist.mateusarce.dev' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/devlist-web:${{ env.SOURCE_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/devlist-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
