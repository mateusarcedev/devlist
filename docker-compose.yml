name: devlist

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io/mateusarcedev}/devlist-migrate:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DIRECT_URL: ${DIRECT_URL:?DIRECT_URL is required}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io/mateusarcedev}/devlist-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DIRECT_URL: ${DIRECT_URL:?DIRECT_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GITHUB_ID: ${GITHUB_ID:?GITHUB_ID is required}
      GITHUB_SECRET: ${GITHUB_SECRET:?GITHUB_SECRET is required}
      API_URL: ${API_URL:?API_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?COOKIE_DOMAIN is required}
      PORT: 3001
    networks:
      - edge
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/mateusarcedev}/devlist-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      URL_API: ${URL_API:-http://api:3001}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    networks:
      - edge
      - backend
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      WEB_DOMAIN: ${WEB_DOMAIN:-devlist.mateusarce.dev}
      API_DOMAIN: ${API_DOMAIN:-api.devlist.mateusarce.dev}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
